<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zahlung erfolgreich · TrackLens</title>
  <meta name="robots" content="noindex">
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--panel:#11151b;--line:#252b34;--text:#f5f7fa;--muted:#aab2bf;--ok:#64d98b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px}h1{font-size:32px;margin:0 0 10px}.status{color:var(--muted);margin:0 0 24px}.ok{color:var(--ok)}a{display:inline-block;color:white;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:11px 15px}
  </style>
</head>
<body>
<main>
  <h1>Zahlung erhalten.</h1>
  <p id="status" class="status">Stripe bestätigt den Bezahlvorgang. Die serverseitige Bestätigung wird geprüft.</p>
  <a href="./">Zurück zu TrackLens</a>
</main>
<script>
(async function(){
  const statusEl=document.getElementById('status');
  const sessionId=new URLSearchParams(location.search).get('session_id');
  if(!sessionId){statusEl.textContent='Die Zahlung wurde abgeschlossen. Die Bestätigung wird per Webhook verarbeitet.';return;}
  for(let attempt=0;attempt<5;attempt++){
    try{
      const response=await fetch('api/checkout-status.php?session_id='+encodeURIComponent(sessionId),{cache:'no-store'});
      if(response.ok){
        const data=await response.json();
        if(data.status==='paid'||data.fulfillment_status==='ready'){
          statusEl.textContent='Zahlung bestätigt. Dein Kauf wurde erfolgreich registriert.';
          statusEl.classList.add('ok');
          return;
        }
      }
    }catch(e){}
    await new Promise(resolve=>setTimeout(resolve,1000));
  }
  statusEl.textContent='Die Zahlung wurde abgeschlossen. Die endgültige Bestätigung wird noch verarbeitet.';
})();
</script>
</body>
</html>
