name: Beta access request
description: Apply for the TrackLens private beta
title: "Beta access: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in TrackLens. Please do not include your email address or private project files here.
  - type: dropdown
    id: ableton
    attributes:
      label: Ableton Live version
      options:
        - Live 12
        - Live 11
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: style
    attributes:
      label: Main music style
      placeholder: Psy-Techno, Melodic Techno, House...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is your biggest arrangement problem?
      placeholder: Tell us where you tend to get stuck when finishing tracks.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Beta expectations
      options:
        - label: I understand this is an early beta and I am willing to report problems.
          required: true
